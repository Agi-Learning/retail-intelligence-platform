name: retail-intelligence-data-platform

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: retail-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: retail_admin
      POSTGRES_DB: retail_platform
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8
        --locale=C.UTF-8
        --data-checksums
        --auth-host=scram-sha-256

    secrets:
      - postgres_admin_password
      - postgres_migration_password
      - postgres_app_password
      - postgres_cdc_password
      - postgres_loader_password
      - postgres_analyst_password
      - postgres_monitor_password

    ports:
      - "127.0.0.1:5439:5432"

    volumes:
      - retail_postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - retail_data_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=retail_admin --dbname=retail_platform"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    shm_size: "2gb"
    mem_limit: "16g"
    cpus: 8

    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_connections=150
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - output_plugin_libraries=pgoutput

  flyway:
    image: redgate/flyway:13.3
    container_name: retail-flyway

    profiles:
      - migration

    depends_on:
      postgres:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        export FLYWAY_PASSWORD="$$(tr -d '\r\n' < /run/secrets/postgres_migration_password)"

        exec flyway \
          -url=jdbc:postgresql://postgres:5432/retail_platform \
          -user=retail_migration \
          -defaultSchema=audit \
          -locations=filesystem:/flyway/sql/versioned,filesystem:/flyway/sql/repeatable,filesystem:/flyway/sql/callbacks \
          -connectRetries=60 \
          -validateMigrationNaming=true \
          "$${FLYWAY_COMMAND:-info}"

    secrets:
      - postgres_migration_password

    volumes:
      - ../../../source-system/database/migrations:/flyway/sql:ro

    networks:
      - retail_data_network

  kafka:
    image: apache/kafka:4.3.1
    container_name: retail-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: >-
        broker,controller

      KAFKA_LISTENERS: >-
        INTERNAL://:29092,
        CONTROLLER://:29093,
        EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://retail-kafka:29092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@retail-kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    ports:
      - "127.0.0.1:9092:9092"

    volumes:
      - retail_kafka_data:/var/lib/kafka/data

    networks:
      - retail_data_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

    mem_limit: "4g"
    cpus: 2

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: retail-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - /opt/retail-kafka/init-topics.sh

    volumes:
      - ./kafka/init-topics.sh:/opt/retail-kafka/init-topics.sh:ro

    networks:
      - retail_data_network

    restart: "no"
  
  connect:
    image: quay.io/debezium/connect:3.6
    container_name: retail-connect
    restart: unless-stopped

    group_add:
      - "${RETAIL_SECRETS_GID:-999}"

    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        install -d -m 700 /tmp/retail-connect-secrets
        umask 077
        tr -d '\r\n' \
          < /run/secrets/postgres_cdc_password \
          > /tmp/retail-connect-secrets/postgres_cdc_password
        test -s /tmp/retail-connect-secrets/postgres_cdc_password
        exec /docker-entrypoint.sh start
    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

      kafka-init:
        condition: service_completed_successfully

    environment:
      BOOTSTRAP_SERVERS: retail-kafka:29092
      GROUP_ID: retail-connect-cluster

      CONFIG_STORAGE_TOPIC: retail.connect.configs
      OFFSET_STORAGE_TOPIC: retail.connect.offsets
      STATUS_STORAGE_TOPIC: retail.connect.status

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: >-
        org.apache.kafka.connect.json.JsonConverter

      VALUE_CONVERTER: >-
        org.apache.kafka.connect.json.JsonConverter

      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"

      ADVERTISED_HOST_NAME: retail-connect
      REST_PORT: 8083

      OFFSET_FLUSH_INTERVAL_MS: 10000
      # CONNECT_CONFIG_PROVIDERS: file
      # CONNECT_CONFIG_PROVIDERS_FILE_CLASS: >-
      #   org.apache.kafka.common.config.provider.FileConfigProvider
      # CONNECT_CONFIG_PROVIDERS: directory
      # CONNECT_CONFIG_PROVIDERS_DIRECTORY_CLASS: >-
      #   org.apache.kafka.common.config.provider.DirectoryConfigProvider
      CONNECT_CONFIG_PROVIDERS: directory
      CONNECT_CONFIG_PROVIDERS_DIRECTORY_CLASS: org.apache.kafka.common.config.provider.DirectoryConfigProvider
      CONNECT_TOPIC_CREATION_ENABLE: "false"

    secrets:
      - postgres_cdc_password

    ports:
      - "127.0.0.1:8083:8083"

    networks:
      - retail_data_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8083/connectors >/dev/null"
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

    mem_limit: "2g"
    cpus: 2

secrets:
  postgres_admin_password:
    file: ../../../secrets/postgres/admin_password.txt

  postgres_migration_password:
    file: ../../../secrets/postgres/migration_password.txt

  postgres_app_password:
    file: ../../../secrets/postgres/app_password.txt

  postgres_cdc_password:
    file: ../../../secrets/postgres/cdc_password.txt

  postgres_loader_password:
    file: ../../../secrets/postgres/loader_password.txt

  postgres_analyst_password:
    file: ../../../secrets/postgres/analyst_password.txt

  postgres_monitor_password:
    file: ../../../secrets/postgres/monitor_password.txt

volumes:
  retail_postgres_data:
    name: retail-postgres-data

  retail_kafka_data:
    name: retail-kafka-data

networks:
  retail_data_network:
    name: retail-data-network
    # internal: true